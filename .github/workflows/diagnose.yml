name: R36 arithmetic diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[brush]"
      - run: python scripts/diagnose_platform.py --out _diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-fingerprint-diagnostic
          path: _diagnostic/*.json
          if-no-files-found: error
          retention-days: 7
